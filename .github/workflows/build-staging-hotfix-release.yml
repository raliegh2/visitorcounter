name: Build staging hotfix release

on:
  push:
    branches:
      - hotfix/church-care-hub-release

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix/church-care-hub-release

      - name: Apply exact validated dev tree on staging ancestry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git rm -r --ignore-unmatch .
          git checkout origin/dev -- .
          git commit -m "hotfix: stage validated Church Care Hub release"
          git push origin HEAD:hotfix/church-care-hub-release
