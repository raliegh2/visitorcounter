name: Fix production migration lineage

on:
  push:
    branches:
      - hotfix/church-care-hub-production

permissions:
  contents: write

jobs:
  build-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/church-care-hub-production
          fetch-depth: 0

      - name: Build compatibility migration
        shell: bash
        run: |
          cat > supabase/migrations/202607300006_role_workspaces_members_care.sql <<'SQL'
          -- Compatibility placeholder.
          -- The canonical Church Care Hub schema is defined by
          -- 202607300002_integrate_care_hub.sql. This legacy release file remains
          -- in the repository so existing remote migration ledgers stay aligned.
          select 1;
          SQL

          migration="supabase/migrations/20260803040000_reconcile_care_hub_release.sql"
          cat > "$migration" <<'SQL'
          begin;

          -- Remove legacy RPC shapes before changing columns they expose.
          drop function if exists public.ministry_dashboard_metrics() cascade;
          drop function if exists public.search_members(text) cascade;
          drop function if exists public.create_member(text, text, text, text, text, text, date) cascade;
          drop function if exists public.bulk_import_members(jsonb) cascade;
          drop function if exists public.search_care_people(text) cascade;
          drop function if exists public.search_care_people(text, boolean) cascade;
          drop function if exists public.care_notes_for_person(text, uuid) cascade;
          drop function if exists public.visits_for_person(text, uuid) cascade;
          drop function if exists public.add_care_note(text, uuid, text, text, text) cascade;
          drop function if exists public.record_person_visit(text, uuid, text) cascade;
          drop function if exists public.list_pastor_applications() cascade;
          drop function if exists public.review_pastor_application(uuid, boolean, text) cascade;
          drop function if exists public.set_user_role(uuid, public.app_role) cascade;

          alter table public.user_profiles
            drop constraint if exists user_profiles_requested_role_check;
          alter table public.user_profiles
            alter column requested_role drop default;

          do $$
          declare
            v_udt text;
          begin
            select c.udt_name into v_udt
            from information_schema.columns c
            where c.table_schema = 'public'
              and c.table_name = 'user_profiles'
              and c.column_name = 'requested_role';

            if v_udt = 'text' then
              execute $ddl$
                alter table public.user_profiles
                alter column requested_role type public.app_role
                using case
                  when requested_role in ('administrator', 'usher', 'pastor', 'auditor')
                    then requested_role::public.app_role
                  else role
                end
              $ddl$;
            end if;
          end
          $$;

          alter table public.user_profiles
            alter column requested_role set default 'usher'::public.app_role,
            alter column requested_role set not null;
          update public.user_profiles
          set requested_role = role
          where requested_role is null;
          alter table public.user_profiles
            drop constraint if exists user_profiles_role_status_check;
          alter table public.user_profiles
            add constraint user_profiles_role_status_check
            check (role_status in ('pending', 'approved', 'rejected'));

          alter table public.members
            add column if not exists ministry text,
            add column if not exists joined_date date,
            add column if not exists active boolean not null default true;

          do $$
          begin
            if exists (
              select 1 from information_schema.columns
              where table_schema = 'public' and table_name = 'members'
                and column_name = 'membership_status'
            ) then
              update public.members
              set active = membership_status <> 'inactive';
            end if;
          end
          $$;

          alter table public.members
            drop constraint if exists members_organization_id_fkey,
            drop constraint if exists members_created_by_fkey,
            drop constraint if exists members_created_by_same_org;
          alter table public.members
            add constraint members_organization_id_fkey
              foreign key (organization_id) references public.organizations(id) on delete restrict;
          create unique index if not exists members_org_id_id_uidx
            on public.members (organization_id, id);
          alter table public.members
            add constraint members_created_by_same_org
              foreign key (organization_id, created_by)
              references public.user_profiles (organization_id, id)
              on delete restrict;

          alter table public.care_notes
            add column if not exists note_type text not null default 'care',
            add column if not exists resolved_at timestamptz;
          update public.care_notes
          set status = case when status = 'resolved' then 'resolved' else 'open' end,
              visibility = case when visibility = 'admin_only' then 'administrator' else visibility end,
              resolved_at = case
                when status = 'resolved' then coalesce(resolved_at, updated_at, created_at)
                else null
              end;
          alter table public.care_notes
            drop constraint if exists care_notes_note_text_check,
            drop constraint if exists care_notes_status_check,
            drop constraint if exists care_notes_visibility_check,
            drop constraint if exists care_notes_one_person,
            drop constraint if exists care_notes_organization_id_fkey,
            drop constraint if exists care_notes_visitor_id_fkey,
            drop constraint if exists care_notes_member_id_fkey,
            drop constraint if exists care_notes_created_by_fkey,
            drop constraint if exists care_notes_visitor_same_org,
            drop constraint if exists care_notes_member_same_org,
            drop constraint if exists care_notes_actor_same_org;
          alter table public.care_notes
            add constraint care_notes_note_text_check
              check (char_length(btrim(note_text)) between 2 and 2000),
            add constraint care_notes_status_check
              check (status in ('open', 'resolved')),
            add constraint care_notes_visibility_check
              check (visibility in ('assigned_team', 'pastoral_team', 'administrator')),
            add constraint care_notes_one_person
              check ((visitor_id is null) <> (member_id is null)),
            add constraint care_notes_organization_id_fkey
              foreign key (organization_id) references public.organizations(id) on delete restrict,
            add constraint care_notes_visitor_same_org
              foreign key (organization_id, visitor_id)
              references public.visitors (organization_id, id) on delete restrict,
            add constraint care_notes_member_same_org
              foreign key (organization_id, member_id)
              references public.members (organization_id, id) on delete restrict,
            add constraint care_notes_actor_same_org
              foreign key (organization_id, created_by)
              references public.user_profiles (organization_id, id) on delete restrict;

          alter table public.visit_records
            drop constraint if exists visit_records_outcome_check,
            drop constraint if exists visit_records_one_person,
            drop constraint if exists visit_records_organization_id_fkey,
            drop constraint if exists visit_records_visitor_id_fkey,
            drop constraint if exists visit_records_member_id_fkey,
            drop constraint if exists visit_records_visited_by_fkey,
            drop constraint if exists visit_records_visitor_same_org,
            drop constraint if exists visit_records_member_same_org,
            drop constraint if exists visit_records_actor_same_org;
          alter table public.visit_records
            add constraint visit_records_outcome_check
              check (char_length(btrim(outcome)) between 2 and 120),
            add constraint visit_records_one_person
              check ((visitor_id is null) <> (member_id is null)),
            add constraint visit_records_organization_id_fkey
              foreign key (organization_id) references public.organizations(id) on delete restrict,
            add constraint visit_records_visitor_same_org
              foreign key (organization_id, visitor_id)
              references public.visitors (organization_id, id) on delete restrict,
            add constraint visit_records_member_same_org
              foreign key (organization_id, member_id)
              references public.members (organization_id, id) on delete restrict,
            add constraint visit_records_actor_same_org
              foreign key (organization_id, visited_by)
              references public.user_profiles (organization_id, id) on delete restrict;

          alter table public.pastor_applications
            drop constraint if exists pastor_applications_organization_id_fkey,
            drop constraint if exists pastor_applications_profile_id_fkey,
            drop constraint if exists pastor_applications_reviewed_by_fkey,
            drop constraint if exists pastor_application_profile_same_org,
            drop constraint if exists pastor_application_reviewer_same_org,
            drop constraint if exists pastor_applications_district_check,
            drop constraint if exists pastor_applications_denomination_check,
            drop constraint if exists pastor_applications_verification_notes_check;
          alter table public.pastor_applications
            add constraint pastor_applications_district_check
              check (char_length(btrim(district)) between 2 and 120),
            add constraint pastor_applications_denomination_check
              check (char_length(btrim(denomination)) between 2 and 120),
            add constraint pastor_applications_verification_notes_check
              check (verification_notes is null or char_length(btrim(verification_notes)) <= 500),
            add constraint pastor_application_profile_same_org
              foreign key (organization_id, profile_id)
              references public.user_profiles (organization_id, id) on delete cascade,
            add constraint pastor_application_reviewer_same_org
              foreign key (organization_id, reviewed_by)
              references public.user_profiles (organization_id, id) on delete restrict;

          drop index if exists public.members_org_name_idx;
          create index members_org_name_idx
            on public.members (organization_id, lower(last_name), lower(first_name))
            where active = true;
          create index if not exists care_notes_org_person_idx
            on public.care_notes (organization_id, visitor_id, member_id, created_at desc);
          create index if not exists care_notes_org_status_idx
            on public.care_notes (organization_id, status, created_at desc);
          create index if not exists visit_records_org_person_idx
            on public.visit_records (organization_id, visitor_id, member_id, visited_at desc);
          create index if not exists pastor_applications_org_time_idx
            on public.pastor_applications (organization_id, submitted_at desc);

          create or replace trigger set_members_updated_at
          before update on public.members
          for each row execute function public.set_updated_at();

          drop policy if exists members_select_pastor_admin on public.members;
          drop policy if exists members_insert_pastor_admin on public.members;
          drop policy if exists members_update_pastor_admin on public.members;
          drop policy if exists members_delete_admin on public.members;
          drop policy if exists care_notes_select_ministry on public.care_notes;
          drop policy if exists care_notes_insert_ministry on public.care_notes;
          drop policy if exists care_notes_update_pastor_admin on public.care_notes;
          drop policy if exists care_notes_delete_admin on public.care_notes;
          drop policy if exists visit_records_select_ministry on public.visit_records;
          drop policy if exists visit_records_insert_ministry on public.visit_records;
          drop policy if exists visit_records_update_pastor_admin on public.visit_records;
          drop policy if exists pastor_applications_select_self on public.pastor_applications;
          drop policy if exists pastor_applications_admin_select on public.pastor_applications;
          SQL

          awk '
            /^create or replace function public.current_profile_is_valid\(\)/ { copy=1 }
            copy && !/^commit;$/ { print }
          ' supabase/migrations/202607300002_integrate_care_hub.sql >> "$migration"

          cat >> "$migration" <<'SQL'

          revoke all on function public.set_user_role(uuid, public.app_role) from public, anon;
          grant execute on function public.set_user_role(uuid, public.app_role) to authenticated;

          commit;
          SQL

      - name: Add legacy migration-ledger reconciliation
        run: |
          cat > scripts/deploy-supabase.mjs <<'JS'
          import { spawnSync } from "node:child_process";

          for (const name of ["SUPABASE_ACCESS_TOKEN", "SUPABASE_PROJECT_ID", "SUPABASE_DB_PASSWORD"]) {
            if (!process.env[name]) {
              console.error(`Missing required variable: ${name}`);
              process.exit(1);
            }
          }

          function invoke(args, stdio = "inherit") {
            return spawnSync("npx", ["--yes", "supabase@2.107.0", ...args], {
              stdio,
              encoding: stdio === "pipe" ? "utf8" : undefined,
              shell: process.platform === "win32",
              env: process.env
            });
          }

          function run(args) {
            const result = invoke(args);
            if (result.status !== 0) process.exit(result.status ?? 1);
          }

          function capture(args) {
            const result = invoke(args, "pipe");
            if (result.status !== 0) {
              process.stderr.write(result.stderr ?? "");
              process.exit(result.status ?? 1);
            }
            return `${result.stdout ?? ""}\n${result.stderr ?? ""}`;
          }

          function remoteMigrationVersions(output) {
            const versions = new Set();
            for (const line of output.split(/\r?\n/)) {
              const cells = line.split("│");
              if (cells.length < 2) continue;
              const remote = cells[1]?.trim();
              if (remote && /^\d{12,14}$/.test(remote)) versions.add(remote);
            }
            return versions;
          }

          async function updateAuthConfiguration() {
            const response = await fetch(
              `https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_ID}/config/auth`,
              {
                method: "PATCH",
                headers: {
                  Authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  password_min_length: 12,
                  password_required_characters: "",
                  mfa_totp_enroll_enabled: false,
                  mfa_totp_verify_enabled: false
                })
              }
            );

            if (!response.ok) {
              const details = await response.text();
              console.error(`Supabase Auth configuration update failed (${response.status}): ${details}`);
              process.exit(1);
            }
          }

          const passwordArgs = ["--password", process.env.SUPABASE_DB_PASSWORD];
          run(["link", "--project-ref", process.env.SUPABASE_PROJECT_ID, ...passwordArgs, "--yes"]);

          const migrationList = capture(["migration", "list", "--linked", ...passwordArgs]);
          const remoteVersions = remoteMigrationVersions(migrationList);
          const legacyReleaseMarker = "20260730205534";
          const canonicalEquivalentVersions = [
            "202607300001",
            "202607300002",
            "202607300003",
            "202607300004",
            "202607300005",
            "202607300006"
          ];

          if (remoteVersions.has(legacyReleaseMarker)) {
            const missingEquivalents = canonicalEquivalentVersions.filter(
              (version) => !remoteVersions.has(version)
            );
            if (missingEquivalents.length > 0) {
              console.log(
                `Legacy Church Care Hub migration ledger detected; recording canonical equivalents: ${missingEquivalents.join(", ")}`
              );
              run([
                "migration",
                "repair",
                ...missingEquivalents,
                "--status",
                "applied",
                "--linked",
                ...passwordArgs
              ]);
            }
          }

          run(["db", "push", "--linked", ...passwordArgs, "--dry-run"]);
          run(["db", "push", "--linked", ...passwordArgs, "--yes"]);
          await updateAuthConfiguration();

          console.log("Supabase migrations and Auth configuration deployed.");
          JS

      - name: Commit migration repair
        run: |
          rm -f .github/workflows/fix-production-migration-lineage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile Church Care Hub migration lineage"
          git push origin HEAD:hotfix/church-care-hub-production
