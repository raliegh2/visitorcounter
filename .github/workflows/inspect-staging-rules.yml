name: Inspect main rules

on:
  push:
    branches:
      - chore/inspect-staging-rules

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, 'record main rule inspection') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/inspect-staging-rules
          fetch-depth: 0

      - name: Inspect active main rules
        shell: bash
        run: |
          rm -rf .audit/main-rules
          mkdir -p .audit/main-rules
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" \
            > .audit/main-rules/active-rules.json \
            2> .audit/main-rules/active-rules-error.txt || true

      - name: Record inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .audit/main-rules
          git commit -m "chore: record main rule inspection"
          git push origin HEAD:chore/inspect-staging-rules
