name: Dispatch Church Care Hub production

on:
  push:
    branches:
      - chore/dispatch-church-care-hub-production

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: ${{ !contains(github.event.head_commit.message, 'record production dispatch') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dispatch-church-care-hub-production
          fetch-depth: 0
      - name: Dispatch protected production workflow
        shell: bash
        run: |
          rm -rf .audit/production-dispatch
          mkdir -p .audit/production-dispatch
          set +e
          gh workflow run deploy-production.yml --ref main \
            > .audit/production-dispatch/stdout.txt \
            2> .audit/production-dispatch/stderr.txt
          STATUS=$?
          set -e
          printf 'status=%s\n' "$STATUS" > .audit/production-dispatch/status.txt
          if [[ "$STATUS" -ne 0 ]]; then
            cat .audit/production-dispatch/stderr.txt
            exit "$STATUS"
          fi
      - name: Record dispatch result
        run: |
          rm -f .github/workflows/dispatch-church-care-hub-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record production dispatch"
          git push origin HEAD:chore/dispatch-church-care-hub-production
