name: Reconcile staging lineage

on:
  push:
    branches:
      - chore/reconcile-staging-lineage

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'reconcile staging lineage') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/reconcile-staging-lineage

      - name: Record staging ancestry without replacing validated dev content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          git merge -s ours --no-edit origin/staging -m "chore: reconcile staging lineage"
          git push origin HEAD:chore/reconcile-staging-lineage
