name: Audit staging conflicts

on:
  push:
    branches:
      - chore/audit-staging-conflicts

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'record staging conflict audit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/audit-staging-conflicts

      - name: Attempt staging merge and capture conflicts
        shell: bash
        run: |
          rm -rf .audit/staging-conflicts
          mkdir -p .audit/staging-conflicts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin staging
          set +e
          git merge --no-commit --no-ff origin/staging > .audit/staging-conflicts/merge-output.txt 2>&1
          MERGE_STATUS=$?
          set -e
          printf 'merge_status=%s\n' "$MERGE_STATUS" > .audit/staging-conflicts/summary.txt
          git diff --name-only --diff-filter=U | tee .audit/staging-conflicts/conflicts.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            safe=$(printf '%s' "$file" | tr '/ ' '__')
            git show ":1:$file" > ".audit/staging-conflicts/${safe}.base" 2>/dev/null || true
            git show ":2:$file" > ".audit/staging-conflicts/${safe}.dev" 2>/dev/null || true
            git show ":3:$file" > ".audit/staging-conflicts/${safe}.staging" 2>/dev/null || true
          done < .audit/staging-conflicts/conflicts.txt
          git merge --abort || true

      - name: Record audit results
        run: |
          git add .audit/staging-conflicts
          git commit -m "chore: record staging conflict audit"
          git push origin HEAD:chore/audit-staging-conflicts
