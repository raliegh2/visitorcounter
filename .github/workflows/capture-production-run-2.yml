name: Capture production run 2

on:
  push:
    branches:
      - chore/dispatch-church-care-hub-production-2

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dispatch-church-care-hub-production-2
          fetch-depth: 0
      - name: Capture latest production run
        run: |
          mkdir -p .audit/production-run-2
          gh run list \
            --workflow deploy-production.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,url,createdAt,displayTitle \
            > .audit/production-run-2/latest.json
          rm -f .github/workflows/capture-production-run-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record second production run"
          git push origin HEAD:chore/dispatch-church-care-hub-production-2
