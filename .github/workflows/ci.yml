name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-placeholder-1234567890
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-1234567890
          REAUTH_COOKIE_SECRET: ci-cookie-placeholder-12345678901234567890
      - run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local database only
        run: supabase db start
      - name: Run pgTAP database tests
        run: supabase test db

  apply-hosted-auth-config:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/apply-hosted-auth-config'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply and verify hosted Supabase Auth settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const projectRef = "vzjcudzsheiszdailwns";
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!token) throw new Error("SUPABASE_ACCESS_TOKEN is not configured.");

          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/config/auth`;
          const headers = {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          };
          const expected = {
            password_min_length: 12,
            password_required_characters: "",
            mfa_totp_enroll_enabled: false,
            mfa_totp_verify_enabled: false
          };

          const patch = await fetch(endpoint, {
            method: "PATCH",
            headers,
            body: JSON.stringify(expected)
          });
          if (!patch.ok) {
            throw new Error(`Supabase Auth config update failed with HTTP ${patch.status}: ${await patch.text()}`);
          }

          await new Promise((resolve) => setTimeout(resolve, 3000));
          const response = await fetch(endpoint, { headers });
          if (!response.ok) {
            throw new Error(`Supabase Auth config verification failed with HTTP ${response.status}.`);
          }

          const config = await response.json();
          const actual = Object.fromEntries(Object.keys(expected).map((key) => [key, config[key]]));
          console.log("Verified hosted Auth settings:", JSON.stringify(actual));

          for (const [key, value] of Object.entries(expected)) {
            if (actual[key] !== value) {
              throw new Error(`Hosted Auth setting ${key} was ${JSON.stringify(actual[key])}, expected ${JSON.stringify(value)}.`);
            }
          }
          NODE
