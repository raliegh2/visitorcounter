name: Capture production run

on:
  push:
    branches:
      - chore/dispatch-church-care-hub-production

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'record production run') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dispatch-church-care-hub-production
          fetch-depth: 0
      - name: Capture latest production workflow run
        run: |
          mkdir -p .audit/production-run
          gh run list \
            --workflow deploy-production.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,url,createdAt,displayTitle \
            > .audit/production-run/latest.json
          rm -f .github/workflows/capture-production-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record production run"
          git push origin HEAD:chore/dispatch-church-care-hub-production
