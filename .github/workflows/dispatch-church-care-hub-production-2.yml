name: Dispatch Church Care Hub production 2

on:
  push:
    branches:
      - chore/dispatch-church-care-hub-production-2

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dispatch-church-care-hub-production-2
          fetch-depth: 0
      - name: Dispatch protected production workflow
        run: gh workflow run deploy-production.yml --ref main
      - name: Record dispatch
        run: |
          mkdir -p .audit/production-dispatch-2
          printf 'dispatched_main_sha=%s\n' "8400808d35bde2bfb65c7438eb295185274a2f10" > .audit/production-dispatch-2/status.txt
          rm -f .github/workflows/dispatch-church-care-hub-production-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record second production dispatch"
          git push origin HEAD:chore/dispatch-church-care-hub-production-2
